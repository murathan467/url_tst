name: Cloud Task Sync Worker

on:
  workflow_dispatch:
  schedule:
    # Her 3 saatte bir tetikleme (Önceki job çalışıyorsa concurrency sayesinde kuyruğa alınır ve süre bitince anında başlar)
    - cron: '0 */3 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-worker-runner
  cancel-in-progress: false

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # 6 saatlik sert sınırdan hemen önce güvenli bitiş

    steps:
      - name: Repo Kodlarını Çek
        uses: actions/checkout@v4

      - name: Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Kütüphaneleri ve Tarayıcı Motorunu Kur
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Oturum Çerezlerini Yükle (Varsa)
        env:
          SESSION_COOKIES: ${{ secrets.SESSION_COOKIES }}
        run: |
          python -c "
          import os, json
          raw = os.environ.get('SESSION_COOKIES', '').strip()
          if raw:
              try:
                  data = json.loads(raw)
                  with open('session_cookies.json', 'w', encoding='utf-8') as f:
                      json.dump(data, f)
                  print('session_cookies.json başarıyla oluşturuldu.')
              except Exception as e:
                  print(f'Uyarı: SESSION_COOKIES JSON formatı okunamadı: {e}')
          else:
              print('Kayıtlı oturum bulunamadı, form girişi denenecek.')
          "

      - name: Senkronizasyon İşçisini Çalıştır (5 Saat 45 Dakika)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FB_EMAIL: ${{ secrets.FB_EMAIL }}
          FB_PASSWORD: ${{ secrets.FB_PASSWORD }}
          TARGET_BASE_URL: ${{ secrets.TARGET_BASE_URL }}
        run: |
          echo "Worker 5 saat 45 dakika boyunca çalışacak şekilde başlatılıyor..."
          end=$((SECONDS+20700))
          while [ $SECONDS -lt $end ]; do
            remaining=$((end-SECONDS))
            echo "Kalan çalışma süresi: $remaining saniye..."
            timeout -s SIGINT ${remaining}s python main_local.py || true
            if [ $SECONDS -lt $end ]; then
              echo "İşlem kapandı. 5 saniye içinde otomatik yeniden başlatılıyor..."
              sleep 5
            fi
          done

      - name: Süre Dolduğunda Yeni Döngüyü Otomatik Tetikle (7/24 Kesintisiz)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AUTO_RESTART_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "Mevcut süre tamamlandı, yeni döngü başlatılıyor..."
          gh workflow run bot.yml --repo ${{ github.repository }} --ref main || true
